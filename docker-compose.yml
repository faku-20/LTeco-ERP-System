services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: ltecobike_web
    ports:
      - "127.0.0.1:8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    env_file:
      - .env
    volumes:
      - ./public-web:/var/www/html/public-web:z
      - ./shared:/var/www/html/shared:z
      - ./src:/var/www/html/src:z
      - ./lteco-panel/uploads/vehiculos:/var/www/html/lteco-panel/uploads/vehiculos:z

  panel:
    build:
      context: .
      dockerfile: docker/Dockerfile.panel
    container_name: ltecobike_panel
    ports:
      - "127.0.0.1:8081:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    env_file:
      - .env
    volumes:
      - ./lteco-panel:/var/www/html/lteco-panel:z
      - ./public-web:/var/www/html/public-web:z
      - ./database:/var/www/html/database:z
      - /opt/backups/ltecobike:/opt/backups/ltecobike:z
      - ./shared:/var/www/html/shared:z
      - ./src:/var/www/html/src:z
      - ./tests:/var/www/html/tests:z
      - ./storefront:/var/www/html/storefront:ro,z
      - ./docker:/var/www/html/docker:ro,z

  ecommerce_worker:
    image: ltecobike-panel
    container_name: ltecobike_ecommerce_worker
    depends_on:
      - panel
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    env_file:
      - .env
    command: ["sh", "-c", "while true; do php /var/www/html/lteco-panel/scripts/operational_health.php --record-heartbeat; php /var/www/html/lteco-panel/cron/ecommerce.php; sleep 60; done"]
    volumes:
      - ./lteco-panel:/var/www/html/lteco-panel:z
      - ./database:/var/www/html/database:z
      - ./shared:/var/www/html/shared:z
      - ./src:/var/www/html/src:z
