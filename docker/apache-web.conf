<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public-web
    DirectoryIndex index.php index.html

    Alias /public-web /var/www/html/public-web
    Alias /lteco-panel/uploads/vehiculos /var/www/html/lteco-panel/uploads/vehiculos

    <Directory /var/www/html/public-web>
        Options +FollowSymLinks -Indexes
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    <Directory /var/www/html/lteco-panel/uploads/vehiculos>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted

        <FilesMatch "\.(php|phtml|phar|php[0-9]?|cgi|pl|sh)$">
            Require all denied
        </FilesMatch>

        RemoveHandler .php .phtml .phar .php3 .php4 .php5 .php7 .php8 .cgi .pl .sh
        RemoveType .php .phtml .phar .php3 .php4 .php5 .php7 .php8 .cgi .pl .sh
        php_admin_flag engine off
    </Directory>

    <Directory /var/www/html/shared>
        Options -Indexes
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/web_error.log
    CustomLog ${APACHE_LOG_DIR}/web_access.log combined
</VirtualHost>
