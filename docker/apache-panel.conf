<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    RedirectMatch 302 ^/$ /lteco-panel/login.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/shared>
        Require all denied
    </Directory>


    # Directorios internos: PHP puede leerlos desde el filesystem,
    # pero nunca deben ser accesibles mediante HTTP.
    <Directory /var/www/html/database>
        Require all denied
    </Directory>

    <Directory /var/www/html/tests>
        Require all denied
    </Directory>

    <Directory /var/www/html/src>
        Require all denied
    </Directory>

    <Directory /var/www/html/vendor>
        Require all denied
    </Directory>

    <Directory /var/www/html/public-web>
        Require all denied
    </Directory>

    <Directory /var/www/html/lteco-panel/uploads>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted

        <FilesMatch "\.(php|phtml|phar|php[0-9]?|cgi|pl|sh)$">
            Require all denied
        </FilesMatch>

        RemoveHandler .php .phtml .phar .php3 .php4 .php5 .php7 .php8 .cgi .pl .sh
        RemoveType .php .phtml .phar .php3 .php4 .php5 .php7 .php8 .cgi .pl .sh
        php_admin_flag engine off
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
